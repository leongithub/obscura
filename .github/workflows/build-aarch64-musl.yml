name: Build Obscura v0.2.6 (stealth + render) aarch64-musl

on:
  workflow_dispatch:
  push:
    branches:
      - build-v0.2.6-musl

jobs:
  build-stealth-render-musl:
    runs-on: ubuntu-24.04-arm
    env:
      TARGET: aarch64-unknown-linux-musl
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake perl pkg-config curl xz-utils clang libclang-dev

      - name: Install full aarch64-linux-musl C/C++ toolchain
        run: |
          curl -L https://musl.cc -o musl-toolchain.tgz
          sudo tar -xzf musl-toolchain.tgz -C /opt
          echo "/opt/aarch64-linux-musl-native/bin" >> $GITHUB_PATH

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Build obscura-cli (render + stealth)
        env:
          CC_aarch64_unknown_linux_musl: aarch64-linux-musl-gcc
          CXX_aarch64_unknown_linux_musl: aarch64-linux-musl-g++
          AR_aarch64_unknown_linux_musl: aarch64-linux-musl-ar
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-musl-g++
          RUSTFLAGS: "-C target-feature=+crt-static -L /opt/aarch64-linux-musl-native/lib -l static=stdc++ -l static=gcc"
        run: |
          cargo build --release --target $TARGET -p obscura-cli --bins --features render

      - name: Verify static binary & package
        run: |
          mkdir -p dist
          cp target/$TARGET/release/obscura dist/
          /opt/aarch64-linux-musl-native/bin/aarch64-linux-musl-strip dist/obscura || true
          file dist/obscura
          ldd dist/obscura || true
          tar -czvf obscura-v0.2.6-stealth-aarch64-unknown-linux-musl.tar.gz -C dist obscura

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-v0.2.6-stealth-aarch64-linux-musl
          path: obscura-v0.2.6-stealth-aarch64-unknown-linux-musl.tar.gz
